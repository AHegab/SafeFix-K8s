# Custom Gitleaks rules to catch plaintext secrets in ConfigMaps, values.yaml, etc.
[[rules]]
id = "plaintext-password-key"
description = "Hardcoded password in config (plaintext secret)"
regex = '''(?i)\b[a-z0-9_-]*password[a-z0-9_-]*\b\s*:\s*["']?([^"'\n]{5,})["']?'''
secretGroup = 1
path = '''\.ya?ml$'''
stopwords = ["false", "null", "none", "password"]

[[rules]]
id = "plaintext-token-key"
description = "Hardcoded token in config (plaintext secret)"
regex = '''(?i)\b[a-z0-9_-]*token[a-z0-9_-]*\b\s*:\s*["']?([^"'\n]{5,})["']?'''
secretGroup = 1
path = '''\.ya?ml$'''
stopwords = ["false", "null", "none", "token"]

[[rules]]
id = "plaintext-apikey-key"
description = "Hardcoded API key in config (plaintext secret)"
regex = '''(?i)\b[a-z0-9_-]*api[a-z0-9_-]*key[a-z0-9_-]*\b\s*:\s*["']?([^"'\n]{5,})["']?'''
secretGroup = 1
path = '''\.ya?ml$'''
stopwords = ["false", "null", "none", "apikey"]

# Usage: gitleaks detect -v --no-git -c detectors/policies/gitleaks-rules.toml -s .

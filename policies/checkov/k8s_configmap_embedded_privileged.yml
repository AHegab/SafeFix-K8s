metadata:
  id: CUSTOM_K8S_CONFIGMAP_EMBEDDED_PRIVILEGE
  name: "ConfigMap embeds privileged/allowPrivilegeEscalation in data"
  category: Kubernetes
  severity: HIGH
scope:
  provider: kubernetes
definition:
  or:
    # Match "privileged: true" inside any ConfigMap.data value (block scalars included)
    - cond_type: attribute
      resource_types: ["ConfigMap"]
      attribute: data
      operator: jsonpath_exists
      value: "$..[?(@ =~ /(^|\\s)privileged:\\s*true(\\s|$)/i)]"

    # Match "allowPrivilegeEscalation: true" similarly
    - cond_type: attribute
      resource_types: ["ConfigMap"]
      attribute: data
      operator: jsonpath_exists
      value: "$..[?(@ =~ /(^|\\s)allowPrivilegeEscalation:\\s*true(\\s|$)/i)]"

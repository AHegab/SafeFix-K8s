apiVersion: v1
kind: Pod
metadata:
  name: efs-plugin
spec:
  containers:
  - name: efs-plugin
    image: amazon/aws-efs-csi-driver:v1.5.1
    imagePullPolicy: IfNotPresent
    securityContext:
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop:
        - ALL
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
      - ALL

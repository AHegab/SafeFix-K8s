apiVersion: v1
kind: Pod
metadata:
  name: busybox-pod
  namespace: busybox-namespace
spec:
  containers:
  - name: busybox-container
    image: busybox:1.36
    imagePullPolicy: Always
    resources:
      requests:
        cpu: 250m
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop:
        - ALL
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
      - ALL

# Base Docker Compose template for a WordPress instance with a MariaDB backend.
# This configuration stores database credentials in plain text environment variables and
# exposes the database on the network. It illustrates the template used in the paper for
# integrating generated Dockerfiles.
services:
  db:
    image: mariadb:10.6.4-focal
    container_name: db
    command: '--default-authentication-plugin=mysql_native_password'
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: wordpress
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    expose:
      - "3306"
      - "33060"

  wordpress:
    build: .
    container_name: wordpress
    ports:
      - "8888:80"
    restart: always
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_TABLE_PREFIX: wp_

volumes:
  db_data:
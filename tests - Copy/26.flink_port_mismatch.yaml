apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink
  labels:
    app: flink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink
  template:
    metadata:
      labels:
        app: flink
    spec:
      containers:
      - name: flink
        image: bitnami/flink
        # The manifest declares that Flink listens on ports 6121, 6123, and 8081.
        # In reality the application uses an additional dynamic port (e.g., 43271).
        # Exposing unused ports can create unnecessary attack surface.
        ports:
        - containerPort: 6121
        - containerPort: 6123
        - containerPort: 8081
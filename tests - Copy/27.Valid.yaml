# Valid network policy example from KUBETEUS paper (Valid.yaml)
# This policy allows the 'productpage' pod to send TCP traffic to the 'details' pod on port 9080.
kind: NetworkPolicy
metadata:
  name: egress-product
  namespace: bookinfo
spec:
  selector: app == 'productpage'
  egress:
  - action: Allow
    protocol: TCP
    source:
      selector: app == 'details'
    destination:
      ports:
      - 9080

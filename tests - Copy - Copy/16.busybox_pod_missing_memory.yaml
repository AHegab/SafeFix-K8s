apiVersion: v1
kind: Pod
metadata:
  name: busybox-pod
  namespace: busybox-namespace
spec:
  containers:
  - name: busybox-container
    image: busybox:1.36
    imagePullPolicy: Always
    # The CPU request is defined but there is no memory request,
    # which violates policies that require both CPU and memory requests.
    resources:
      requests:
        cpu: 250m
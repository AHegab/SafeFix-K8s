# Misconfigured network policy example from KUBETEUS paper (Misconfiguration.yaml)
# Contains multiple errors: misspelled selector, unsupported endpointSelector field and wrong port.
kind: NetworkPolicy
metadata:
  name: egress-product
  namespace: bookinfo
spec:
  selector: app == 'productpagee'
  egress:
  - action: Allow
    protocol: TCP
    source:
      endpointSelector: app =='details'
    destination:
      ports:
      - 9081

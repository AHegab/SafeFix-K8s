---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: frontend-role
  namespace: default
rules:
  # This role grants more permissions than necessary by allowing both 'get' and 'delete' verbs.
  # According to least‑privilege principles, only the verbs actually required (e.g., 'get') should be granted.
  - resources:
      - pods/frontend
    verbs:
      - get
      - delete
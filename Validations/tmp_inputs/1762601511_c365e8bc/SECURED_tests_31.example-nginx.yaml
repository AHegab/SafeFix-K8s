---
apiVersion: v1
kind: Pod
metadata:
  name: nginx
spec:
  hostPID: true
  hostNetwork: true
  hostIPC: true
  containers:
  - name: nginx
    image: nginx:1.0.0
    ports:
    - containerPort: 80
    securityContext:
      privileged: false
      capabilities:
        add:
        - NET_ADMIN
        - SYS_MODULE
        - SYSLOG
        - NET_RAW
        - CHOWN
        drop:
        - ALL
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  automountServiceAccountToken: false
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
      - ALL

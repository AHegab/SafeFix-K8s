[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safefixk8s"
version = "0.1.0"
description = "Automated Kubernetes security detection, repair, and validation pipeline"
requires-python = ">=3.8"
dependencies = [
    "pyyaml==6.0",
    "requests==2.31.0",
]

[project.scripts]
safefixk8s = "pipeline:main"

[tool.setuptools]
py-modules = ["pipeline"]

[tool.setuptools.packages.find]
include = ["Detection*", "Normalizer*", "LLMs*", "Validations*", "configs*", "policies*"]

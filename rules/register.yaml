rules:
  # ======= Privilege / hardening =======
  - id: RUN_AS_NON_ROOT_MISSING
    severity: HIGH
    kind: ["Pod","Deployment","StatefulSet","DaemonSet","Job","CronJob"]
    where: "containers"                       # iterate containers (handles Pod or template)
    selector:
      anyOf:
        - path: "$.securityContext.runAsNonRoot"
          exists: false
    message: "Container missing securityContext.runAsNonRoot: true"

  - id: ALLOW_PRIV_ESC_TRUE_OR_UNSET
    severity: HIGH
    kind: ["*"]
    where: "containers"
    selector:
      anyOf:
        - path: "$.securityContext.allowPrivilegeEscalation"
          exists: false
        - path: "$.securityContext.allowPrivilegeEscalation"
          equals: true
    message: "allowPrivilegeEscalation not explicitly false"

  - id: PRIVILEGED_CONTAINER
    severity: CRITICAL
    kind: ["*"]
    where: "containers"
    selector:
      anyOf:
        - path: "$.securityContext.privileged"
          equals: true
    message: "Privileged container detected"

  - id: SECCOMP_MISSING
    severity: HIGH
    kind: ["*"]
    selector:
      anyOf:
        - path: "$.spec.securityContext.seccompProfile.type"
          exists: false
        - path: "$.spec.template.spec.securityContext.seccompProfile.type"
          exists: false
    message: "Pod seccompProfile missing (RuntimeDefault recommended)"

  - id: CAPS_NOT_DROPPED
    severity: MEDIUM
    kind: ["*"]
    where: "containers"
    selector:
      anyOf:
        - path: "$.securityContext.capabilities.drop"
          exists: false
    message: "Capabilities not dropped (drop: [\"ALL\"])"

  # ======= Resources / probes =======
  - id: RESOURCES_REQUESTS_LIMITS_MISSING
    severity: MEDIUM
    kind: ["*"]
    where: "containers"
    selector:
      anyOf:
        - path: "$.resources.requests.cpu"     ; exists: false
        - path: "$.resources.requests.memory"  ; exists: false
        - path: "$.resources.limits.cpu"       ; exists: false
        - path: "$.resources.limits.memory"    ; exists: false
    message: "CPU/memory requests/limits missing"

  - id: PROBES_MISSING
    severity: MEDIUM
    kind: ["*"]
    where: "containers"
    selector:
      allOf:
        - path: "$.livenessProbe"  ; exists: false
        - path: "$.readinessProbe" ; exists: false
    message: "Both liveness and readiness probes are missing"

  # ======= Image hygiene =======
  - id: LATEST_TAG_USED
    severity: MEDIUM
    kind: ["*"]
    where: "containers"
    selector:
      anyOf:
        - path: "$.image"
          regex: ":[Ll]atest$"
    message: "Floating :latest tag used"

  - id: LATEST_WITHOUT_PULL_ALWAYS
    severity: MEDIUM
    kind: ["*"]
    where: "containers"
    selector:
      allOf:
        - path: "$.image" ; regex: ":[Ll]atest$"
        - path: "$.imagePullPolicy" ; notEquals: "Always"
    message: "Using :latest without imagePullPolicy: Always"

  # ======= HostPath / docker.sock =======
  - id: DOCKER_SOCK_MOUNT
    severity: HIGH
    kind: ["*"]
    selector:
      anyOf:
        - path: "$..volumes[?(@.hostPath && @.hostPath.path==\"/var/run/docker.sock\")]"
          exists: true
    message: "Host docker socket is mounted"

  - id: HOSTPATH_TYPE_UNSET_FOR_SOCK
    severity: LOW
    kind: ["*"]
    selector:
      anyOf:
        - path: "$..volumes[?(@.hostPath && @.hostPath.path==\"/var/run/docker.sock\" && !@.hostPath.type)]"
          exists: true
    message: "hostPath.type not set for /var/run/docker.sock"

  # ======= ServiceAccount token =======
  - id: SA_TOKEN_AUTOMOUNT_ENABLED
    severity: MEDIUM
    kind: ["*"]
    selector:
      anyOf:
        - path: "$.spec.automountServiceAccountToken" ; notEquals: false
        - path: "$.spec.template.spec.automountServiceAccountToken" ; notEquals: false
    message: "ServiceAccount token auto-mounting not disabled"

  # ======= Minimal schema sanity =======
  - id: METADATA_NAME_MISSING
    severity: HIGH
    kind: ["*"]
    selector:
      anyOf:
        - path: "$.metadata.name" ; exists: false
    message: "metadata.name is required"
